# Сборка и публикация сайта курса.
# На каждый push и pull request — прогон всех примеры.py и полная сборка сайта.
# Ошибка в любом примере останавливает публикацию.
# Push в main дополнительно публикует сайт на GitHub Pages.
# Раз в месяц — контрольный прогон, чтобы заметить поломки от обновлений библиотек.

name: site

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7

      - uses: conda-incubator/setup-miniconda@v4
        with:
          environment-file: environment.yml
          activate-environment: quantinf
          miniforge-version: latest

      - name: Проверка примеров (все примеры.py)
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python -m pytest -q -n auto --durations=5 tests/

      - name: Сборка сайта
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: quarto render

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
