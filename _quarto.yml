filters:
  - path: filters/lecture.lua
    at: pre-ast

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 2
    number-sections: false
    html-math-method: mathjax
    code-tools: true

execute:
  freeze: auto
  warning: false
