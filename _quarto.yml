project:
  type: website
  render:
    - index.qmd
    - Курс_квантовая_информатика_v2.md
    - Лекции/Обозначения.md
    - Лабораторный_практикум.md
    - "Лекции/Часть_I/*/лекция.md"
    - "Лекции/Часть_I/*/лекция.qmd"
    - "Лекции/Часть_II/*/лекция.md"
    - "Лекции/Часть_II/*/лекция.qmd"
  resources:
    - "Лекции/**/примеры.py"
    - "Лекции/I.00_Вводная_лекция/Вводная_лекция.pdf"

lang: ru

website:
  title: "Квантовая информатика"
  site-url: https://soloviev56.github.io/quantinf/
  repo-url: https://github.com/soloviev56/quantinf
  repo-actions: [edit, issue]
  search: true
  page-navigation: true
  page-footer:
    center: >-
      Текст — <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.ru">CC BY-SA 4.0</a>,
      код — MIT
  sidebar:
    style: docked
    contents:
      - index.qmd
      - text: "Программа курса"
        href: Курс_квантовая_информатика_v2.md
